<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Cherry tools overview" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #0F1115; }
    .card { fill: #171A21; stroke: #262B35; stroke-width: 1; }
    .accent { fill: #2A1219; stroke: #D91E3A; stroke-width: 1; }
    .title { font: 700 34px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F4F5F7; }
    .sub { font: 400 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B93A1; }
    .name { font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #FF6B80; }
    .ask { font: 500 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E6E8EC; }
    .does { font: 400 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B93A1; }
    .big { font: 700 28px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FF6B80; }
    .tag { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6FCF8E; letter-spacing: 0.5px; }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>

  <text class="title" x="40" y="62">Cherry</text>
  <text class="sub" x="40" y="88">Seven tools. One job each. Short answers, with the reasoning shown.</text>

  <!-- Row 1 -->
  <g transform="translate(40,116)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">find_orgs</text>
    <text class="ask" x="18" y="64">Which orgs fit my skills?</text>
    <text class="does" x="18" y="88">Ranked matches, with reasons</text>
  </g>
  <g transform="translate(275,116)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">org_overview</text>
    <text class="ask" x="18" y="64">Is this org worth my time?</text>
    <text class="does" x="18" y="88">Stack, history, channels</text>
  </g>
  <g transform="translate(510,116)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">past_projects</text>
    <text class="ask" x="18" y="64">What did they fund?</text>
    <text class="does" x="18" y="88">Recurring ideas, last 2-3 years</text>
  </g>
  <g transform="translate(745,116)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">find_issues</text>
    <text class="ask" x="18" y="64">Where do I start?</text>
    <text class="does" x="18" y="88">Open, unassigned, recent</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40,252)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">my_contributions</text>
    <text class="ask" x="18" y="64">How are my PRs doing?</text>
    <text class="does" x="18" y="88">Review state, stalled PRs</text>
  </g>
  <g transform="translate(275,252)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">whats_next</text>
    <text class="tag" x="152" y="30">FREE</text>
    <text class="ask" x="18" y="64">What should I do this week?</text>
    <text class="does" x="18" y="88">Three concrete actions</text>
  </g>
  <g transform="translate(510,252)">
    <rect class="card" width="215" height="116" rx="10"/>
    <text class="name" x="18" y="32">account_status</text>
    <text class="tag" x="162" y="30">FREE</text>
    <text class="ask" x="18" y="64">What is my quota?</text>
    <text class="does" x="18" y="88">Plan and usage</text>
  </g>
  <g transform="translate(745,252)">
    <rect class="accent" width="215" height="116" rx="10"/>
    <text class="big" x="18" y="52">5 queries</text>
    <text class="ask" x="18" y="78">free per account, ever</text>
    <text class="does" x="18" y="98">Sign in with GitHub, read-only</text>
  </g>
</svg>
